services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: shop
    ports: ["5433:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      retries: 20
  app:
    build: .
    env_file: .env
    environment:
      # inside compose the DB host is "db"
      DATABASE_URL: postgresql://readonly_user:${READONLY_PASSWORD:-change-me}@db:5432/shop
      ADMIN_DATABASE_URL: postgresql://postgres:postgres@db:5432/shop
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}
